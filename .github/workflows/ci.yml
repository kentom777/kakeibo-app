
name: Kakeibo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Typecheck and build
        run: npm run build

      - name: Install browser for tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Save browser test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kakeibo-test-report
          path: |
            playwright-report/
            test-results/
            kakeibo-result.png
          if-no-files-found: ignore
          retention-days: 7
